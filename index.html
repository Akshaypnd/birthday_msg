<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Vasu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
background:#0a0a0a;
color:white;
height:100vh;
}

.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hidden{
display:none;
}

#bg{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

.btn{
padding:18px 40px;
font-size:22px;
font-weight:700;
border:none;
border-radius:50px;
cursor:pointer;
background:linear-gradient(135deg,#ff512f,#dd2476);
color:white;
box-shadow:
0 0 20px rgba(255,80,80,.6),
0 0 40px rgba(255,80,80,.4);
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

.title{
font-size:3rem;
font-weight:900;
margin-bottom:20px;
text-shadow:
0 0 10px #fff,
0 0 20px #ff5e62,
0 0 40px #ff5e62;
}

.line{
font-size:1.5rem;
margin:12px 0;
animation:fadeUp 1s ease forwards;
opacity:0;
}

.line:nth-child(2){animation-delay:.5s;}
.line:nth-child(3){animation-delay:1s;}
.line:nth-child(4){animation-delay:1.5s;}
.line:nth-child(5){animation-delay:2s;}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.from{
margin-top:40px;
font-size:1.3rem;
opacity:.9;
}

.confetti{
position:absolute;
font-size:24px;
animation:fall 4s linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-100px) rotate(0deg);
}
100%{
transform:translateY(120vh) rotate(720deg);
opacity:0;
}
}

</style>
</head>

<body>

    <audio id="bgMusic" loop>
    <source src="birthday-song.mp3" type="audio/mpeg">
</audio>

<canvas id="bg"></canvas>

<div id="first" class="screen">

<h1 style="font-size:2.8rem;margin-bottom:30px;">
🎁
</h1>

<button class="btn" onclick="openWish()">
Click Me Bhai ❤️
</button>

</div>

<div id="second" class="screen hidden">

<h1 class="title">
🎂 HAPPY BIRTHDAY VASU 🎂
</h1>

<div class="line">❤️ Bhai, hamesha khush raho ❤️</div>
<div class="line">⚽ Khelte raho</div>
<div class="line">😎 Masti karte raho</div>
<div class="line">🚀 Mauj karo</div>

<div class="from">
— Krishna ❤️
</div>

</div>

<script>
function openWish(){

const music = document.getElementById("bgMusic");

music.play().catch(err => {
console.log("Audio blocked:", err);
});

document.getElementById("first").classList.add("hidden");
document.getElementById("second").classList.remove("hidden");

for(let i=0;i<100;i++){

let c=document.createElement("div");

c.className="confetti";

c.innerHTML=["🎉","✨","🎊","⭐"][Math.floor(Math.random()*4)];

c.style.left=Math.random()*100+"vw";

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},4000);

}

}
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<120;i++){

particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
d:Math.random()*1.5
});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="rgba(255,255,255,0.8)";

particles.forEach(p=>{

ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();

p.y+=p.d;

if(p.y>canvas.height){
p.y=0;
}

});

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
